<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Acompanhamento - Pendências e Ferramentas</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: auto; }
        h1 { background: #ffcc00; color: #000; text-align: center; padding: 15px; border-radius: 4px; font-size: 20px; margin-top: 0; }
        .filters { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .filters div { flex: 1; min-width: 220px; display: flex; flex-direction: column; }
        .filters label { font-weight: bold; font-size: 13px; margin-bottom: 5px; }
        .filters select, .filters input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: top; }
        th { background: #2c3e50; color: white; }
        tr:nth-child(even) { background: #fafafa; }
        .loading { text-align: center; font-weight: bold; padding: 20px; color: #666; }
        .badge-filial { background: #e0e0e0; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .pendencia-destaque { color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>PAINEL DE PENDÊNCIAS - ÚLTIMO CHECKLIST POR TÉCNICO</h1>
    
    <div class="filters">
        <div>
            <label for="filtroFilial">Filtrar por Filial:</label>
            <select id="filtroFilial" onchange="atualizarFiltrosTecnicos(); filtrarDados();">
                <option value="">Todas as Filiais</option>
                <option value="Cuiabá - MT">Cuiabá - MT</option>
                <option value="Sapezal - MT">Sapezal - MT</option>
                <option value="Goiânia - GO">Goiânia - GO</option>
                <option value="Campo Grande - MS">Campo Grande - MS</option>
            </select>
        </div>
        <div>
            <label for="filtroTecnico">Selecionar Técnico:</label>
            <select id="filtroTecnico" onchange="filtrarDados()">
                <option value="">Todos os Técnicos</option>
            </select>
        </div>
    </div>

    <div id="loading" class="loading">Carregando dados da planilha...</div>

    <div style="overflow-x: auto;">
        <table id="tabelaDados" style="display: none;">
            <thead>
                <tr>
                    <th>Data da Última Checagem</th>
                    <th>Tipo</th>
                    <th>Técnico / CPF</th>
                    <th>Filial</th>
                    <th>Itens Extras / Pendências a Tratar</th>
                    <th>Local</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                <!-- Preenchido via JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxfexbYIqKjeWqHtJ6jsur3zuwW4O5sOHrtme4lsmMsFJA_2tfvvGpiAtbtv0zrShcm4Q/exec";
    let dadosGlobais = [];

    async function carregarDadosPainel() {
        try {
            const resposta = await fetch(`${WEB_APP_URL}?acao=dados`);
            const resultado = await resposta.json();
            
            if (resultado.erro) {
                document.getElementById("loading").innerHTML = `<span style="color:red;">${resultado.erro}</span>`;
                return;
            }

            // Agrupa por CPF ou Nome para manter SOMENTE O ÚLTIMO checklist de cada técnico
            const mapaUltimos = {};
            resultado.forEach(item => {
                if (!item.tecnico) return;
                const chave = item.cpf ? item.cpf.trim() : item.tecnico.trim();
                
                if (!mapaUltimos[chave] || new Date(item.data || 0) > new Date(mapaUltimos[chave].data || 0)) {
                    mapaUltimos[chave] = item;
                }
            });

            dadosGlobais = Object.values(mapaUltimos);
            preencherSelectTecnicos(dadosGlobais);
            renderizarTabela(dadosGlobais);
            document.getElementById("loading").style.display = "none";
            document.getElementById("tabelaDados").style.display = "table";
        } catch (erro) {
            console.error(erro);
            document.getElementById("loading").innerHTML = `<span style="color:red;">Erro ao conectar com o Apps Script. Verifique se a URL está correta e implantada como "Qualquer pessoa".</span>`;
        }
    }

    function preencherSelectTecnicos(dados) {
        const select = document.getElementById("filtroTecnico");
        const filialAtual = document.getElementById("filtroFilial").value.toLowerCase();
        
        select.innerHTML = '<option value="">Todos os Técnicos</option>';
        
        const filtrados = dados.filter(item => {
            return filialAtual === "" || (item.filial && item.filial.toLowerCase().includes(filialAtual));
        });

        filtrados.forEach(item => {
            const opt = document.createElement("option");
            opt.value = item.tecnico;
            opt.textContent = item.tecnico;
            select.appendChild(opt);
        });
    }

    function atualizarFiltrosTecnicos() {
        preencherSelectTecnicos(dadosGlobais);
    }

    function renderizarTabela(dados) {
        const tbody = document.getElementById("corpoTabela");
        tbody.innerHTML = "";

        if (dados.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center;">Nenhum registro encontrado.</td></tr>`;
            return;
        }

        dados.forEach(item => {
            let dataFormatada = "";
            if (item.data) {
                const d = new Date(item.data);
                dataFormatada = !isNaN(d.getTime()) ? d.toLocaleString("pt-BR") : item.data;
            }

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${dataFormatada}</td>
                <td><span style="font-size:11px; font-weight:bold; background:#eef2f7; padding:2px 6px; border-radius:3px;">${item.tipoChecklist || "Checklist"}</span></td>
                <td><strong>${item.tecnico}</strong><br><small>CPF: ${item.cpf}</small></td>
                <td><span class="badge-filial">${item.filial}</span></td>
                <td><span class="pendencia-destaque">${item.itensExtras || "Nenhuma pendência extra / Apenas padrão"}</span></td>
                <td>${item.local}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function filtrarDados() {
        const filialFiltro = document.getElementById("filtroFilial").value.toLowerCase();
        const tecnicoFiltro = document.getElementById("filtroTecnico").value.toLowerCase();

        const filtrados = dadosGlobais.filter(item => {
            const matchFilial = filialFiltro === "" || (item.filial && item.filial.toLowerCase().includes(filialFiltro));
            const matchTecnico = tecnicoFiltro === "" || (item.tecnico && item.tecnico.toLowerCase() === tecnicoFiltro);
            return matchFilial && matchTecnico;
        });

        renderizarTabela(filtrados);
    }

    carregarDadosPainel();
</script>

</body>
</html>
